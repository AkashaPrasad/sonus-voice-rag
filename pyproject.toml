[project]
name = "vaani-voice-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "uvloop>=0.21", "orjson>=3.10",
  "pydantic>=2.9", "pydantic-settings>=2.6", "httpx[http2]>=0.27",
  "model2vec>=0.4", "numpy>=1.26", "bm25s>=0.2", "PyStemmer>=2.2",
  "datasets>=3.0", "huggingface-hub>=0.26", "chonkie>=0.4",
  "python-multipart>=0.0.12", "websockets>=13",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.7", "matplotlib>=3.9"]
[tool.ruff]
line-length = 100
target-version = "py312"
